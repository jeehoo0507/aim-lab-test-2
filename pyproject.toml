[project]
name = "maskedkd-coco-experiment"
version = "0.1.0"
description = "Experiment 2: student-guided masking on a single-label COCO subset"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1", "torchvision==0.20.1", "numpy==1.26.4",
  "pandas==2.2.3", "scipy==1.14.1", "matplotlib==3.9.2",
  "Pillow==11.0.0", "tqdm==4.67.1", "pycocotools==2.0.10",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cu124", marker = "sys_platform == 'linux'"}]
torchvision = [{index = "pytorch-cu124", marker = "sys_platform == 'linux'"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
